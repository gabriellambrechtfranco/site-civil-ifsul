<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/img/IV.ico">
    <title>Engenharia Civil - Horários</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/common/header.css">
    <link rel="stylesheet" href="../../assets/css/common/footer.css">
    <link rel="stylesheet" href="../../assets/css/Cursos/bcc.css">
    <link rel="stylesheet" href="../../assets/css/Cursos/civil-horarios.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <script>
        fetch('../header/index.html')
            .then(r => r.text())
            .then(d => document.getElementById('header-placeholder').innerHTML = d);
    </script>

    <main>
        <section id="time" class="py-5 bg-light" style="margin-top:70px;">
            <div class="container">
                <h2 class="section-title">Horários</h2>
                <p class="section-description">Confira os horários oficiais do curso de Engenharia Civil.</p>
                <div class="schedule-group">
                    <div class="schedule-heading">
                        <span class="schedule-icon"><i class="bi bi-moon-stars"></i></span>
                        <h3 class="schedule-title">Engenharia Civil - Noturno</h3>
                    </div>
                    <div class="schedule-frame-wrapper">
                        <iframe
                            src="https://painel.passofundo.ifsul.edu.br/iframes/horarios.php?curso=25"
                            title="Horários Engenharia Civil Noturno"
                            loading="lazy">
                        </iframe>
                    </div>
                    <a class="schedule-link" href="https://painel.passofundo.ifsul.edu.br/iframes/horarios.php?curso=25" target="_blank" rel="noopener noreferrer">Abrir horário noturno em nova aba</a>
                </div>
                <div class="schedule-group">
                    <div class="schedule-heading">
                        <span class="schedule-icon"><i class="bi bi-sun"></i></span>
                        <h3 class="schedule-title">Engenharia Civil - Diurno</h3>
                    </div>
                    <div class="schedule-frame-wrapper">
                        <iframe
                            src="https://painel.passofundo.ifsul.edu.br/iframes/horarios.php?curso=17"
                            title="Horários Engenharia Civil Diurno"
                            loading="lazy">
                        </iframe>
                    </div>
                    <a class="schedule-link" href="https://painel.passofundo.ifsul.edu.br/iframes/horarios.php?curso=17" target="_blank" rel="noopener noreferrer">Abrir horário diurno em nova aba</a>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script>
        fetch('../footer/index.html')
            .then(r => r.text())
            .then(d => document.getElementById('footer-placeholder').innerHTML = d);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
