    <style>
        .org-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.85rem;
            letter-spacing: 0.2px;
        }

        .org-toolbar .input-group {
            max-width: 560px;
        }

        .org-canvas {
            background: radial-gradient(circle at 20% 10%, rgba(48, 112, 158, 0.10) 0%, rgba(255, 255, 255, 0) 45%),
                radial-gradient(circle at 80% 35%, rgba(13, 110, 253, 0.08) 0%, rgba(255, 255, 255, 0) 45%),
                #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        .org-viewport {
            width: 100%;
            height: min(78vh, 860px);
            overflow: hidden;
            position: relative;
        }

        .org-scene {
            transform-origin: 0 0;
            will-change: transform;
            padding: 28px 28px 60px;
        }

        .org-tree ul {
            padding-top: 36px;
            position: relative;
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 0;
            padding-left: 0;
        }

        .org-tree li {
            list-style-type: none;
            text-align: center;
            position: relative;
            padding: 36px 10px 0;
            margin: 0;
            min-width: 200px;
        }

        .org-tree li::before,
        .org-tree li::after {
            content: '';
            position: absolute;
            top: 0;
            right: 50%;
            border-top: 2px solid rgba(33, 37, 41, 0.14);
            width: 50%;
            height: 36px;
        }

        .org-tree li::after {
            right: auto;
            left: 50%;
            border-left: 2px solid rgba(33, 37, 41, 0.14);
        }

        .org-tree li:only-child::after,
        .org-tree li:only-child::before {
            display: none;
        }

        .org-tree li:only-child {
            padding-top: 0;
        }

        .org-tree li:first-child::before,
        .org-tree li:last-child::after {
            border: 0 none;
        }

        .org-tree li:last-child::before {
            border-right: 2px solid rgba(33, 37, 41, 0.14);
            border-radius: 0 10px 0 0;
        }

        .org-tree li:first-child::after {
            border-radius: 10px 0 0 0;
        }

        .org-tree ul ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-left: 2px solid rgba(33, 37, 41, 0.14);
            width: 0;
            height: 36px;
        }

        .org-tree ul.depth-3,
        .org-tree ul.depth-4,
        .org-tree ul.depth-5 {
            flex-wrap: wrap;
            align-items: stretch;
            justify-content: center;
            gap: 14px;
            padding-top: 18px;
            max-width: 980px;
            margin-left: auto;
            margin-right: auto;
        }

        .org-tree ul.depth-3>li,
        .org-tree ul.depth-4>li,
        .org-tree ul.depth-5>li {
            min-width: 220px;
            padding-top: 0;
            flex: 1 1 240px;
        }

        .org-tree ul.depth-3>li::before,
        .org-tree ul.depth-3>li::after,
        .org-tree ul.depth-4>li::before,
        .org-tree ul.depth-4>li::after,
        .org-tree ul.depth-5>li::before,
        .org-tree ul.depth-5>li::after,
        .org-tree ul.depth-3::before,
        .org-tree ul.depth-4::before,
        .org-tree ul.depth-5::before {
            display: none;
        }

        .org-node {
            display: inline-flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(33, 37, 41, 0.12);
            border-radius: 14px;
            padding: 12px 14px;
            min-width: 220px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
        }

        .org-node:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.10);
            border-color: rgba(48, 112, 158, 0.35);
        }

        .org-node:focus-visible {
            outline: 3px solid rgba(13, 110, 253, 0.25);
            outline-offset: 2px;
        }

        .org-node-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .org-node-title {
            font-weight: 700;
            line-height: 1.2;
        }

        .org-node-sub {
            color: rgba(33, 37, 41, 0.70);
            font-size: 0.92rem;
            line-height: 1.25;
        }

        .org-toggle {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(33, 37, 41, 0.12);
            background: rgba(248, 249, 250, 0.8);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 160ms ease, border-color 160ms ease;
        }

        .org-toggle:hover {
            background: rgba(48, 112, 158, 0.08);
            border-color: rgba(48, 112, 158, 0.25);
        }

        .org-tree li.org-collapsed>ul {
            display: none !important;
        }

        .org-hidden {
            display: none !important;
        }

        .org-match .org-node {
            border-color: rgba(13, 110, 253, 0.55);
            box-shadow: 0 14px 34px rgba(13, 110, 253, 0.12);
        }

        @media (max-width: 768px) {
            .org-viewport {
                height: 72vh;
            }

            .org-tree li {
                min-width: 200px;
            }

            .org-node {
                min-width: 220px;
            }
        }
    </style>
</head>

        function ajustarNavbar() {
            let path = window.location.pathname;
            let isHome = path.includes("/home/index.html") || path.endsWith("/home/");

            let navLinks = document.querySelector(".navbar-nav");

            if (!isHome) {
                let homeLink = navLinks.querySelector("a[href='#home']");
                if (homeLink) homeLink.setAttribute("href", "../../src/home/index.html");

                let scheduleLink = navLinks.querySelector("a[href='#programacao']");
                if (scheduleLink) scheduleLink.setAttribute("href", "../../src/programacao/index.html");

                let contatoLink = navLinks.querySelector("a[href='#contato']");
                if (contatoLink) contatoLink.closest("li").remove();

                let arenaLink = navLinks.querySelector("a[href='#arena']");
                if (arenaLink) arenaLink.setAttribute("href", "../arenagame/index.html");
            }
        }

        function normalizeText(value) {
            return (value || "")
                .toString()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        }

        async function copyText(value) {
            const text = (value || "").toString();
            if (!text) return false;

            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return true;
            }

            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "absolute";
            textarea.style.left = "-9999px";
            document.body.appendChild(textarea);
            textarea.select();
            const ok = document.execCommand("copy");
            textarea.remove();
            return ok;
        }

        function flattenTree(root) {
            const nodes = new Map();
            const parentById = new Map();
            const allIds = [];

            function walk(node, parentId) {
                nodes.set(node.id, node);
                allIds.push(node.id);
                if (parentId) parentById.set(node.id, parentId);
                (node.children || []).forEach(child => walk(child, node.id));
            }

            walk(root, null);
            return { nodes, parentById, allIds };
        }

        const orgClear = document.getElementById("orgClear");

        const { nodes: nodeById, parentById, allIds } = flattenTree(orgTreeData);

        function getNodeText(node) {
            return normalizeText(`${node.code} ${node.name} ${node.person || ""}`);
        }

        function renderTree(node, depth) {
            const hasChildren = (node.children || []).length > 0;
            const person = node.person && node.person.trim() !== "-" ? node.person : "";

            const childrenHtml = hasChildren
                ? `<ul class="depth-${depth + 1}">${node.children.map(child => renderTree(child, depth + 1)).join("")}</ul>`
                : "";

            const toggleHtml = hasChildren
                ? `<button type="button" class="org-toggle" data-action="toggle" aria-label="Expandir/Recolher">
                        <i class="bi bi-chevron-down"></i>
                    </button>`
                : "";

            const badgeColor = node.code === "CÂMPUS"
                ? "text-bg-primary"
                : (node.type === "group" ? "text-bg-secondary" : "text-bg-success");

            return `
                <li data-id="${node.id}" class="${node.defaultCollapsed ? "org-collapsed" : ""} depth-${depth}">
                    <div class="org-node" role="button" tabindex="0" data-action="open">
                        <div class="org-node-top">
                            <span class="badge ${badgeColor} org-code">${node.code}</span>
                            ${toggleHtml}
                        </div>
                        <div class="org-node-title">${node.name}</div>
                        ${person ? `<div class="org-node-sub">${person}</div>` : `<div class="org-node-sub"> </div>`}
                    </div>
                    ${childrenHtml}
                </li>
            `;
        }

        orgTree.innerHTML = `<ul class="depth-0">${renderTree(orgTreeData, 0)}</ul>`;

        function setCollapseAll(collapsed) {
            orgTree.querySelectorAll("li").forEach(li => {
                const id = li.getAttribute("data-id");
                const node = nodeById.get(id);
                if (!node) return;
                const hasChildren = (node.children || []).length > 0;
                if (!hasChildren) return;
                if (collapsed) li.classList.add("org-collapsed");
                else li.classList.remove("org-collapsed");
            });
            updateChevronIcons();
        }

        function updateChevronIcons() {
            orgTree.querySelectorAll("li").forEach(li => {
                const toggle = li.querySelector(":scope > .org-node [data-action='toggle'] i");
                if (!toggle) return;
                if (li.classList.contains("org-collapsed")) {
                    toggle.classList.remove("bi-chevron-down");
                    toggle.classList.add("bi-chevron-right");
                } else {
                    toggle.classList.remove("bi-chevron-right");
                    toggle.classList.add("bi-chevron-down");
                }
            });
        }

        function showModalForNode(nodeId) {
            const node = nodeById.get(nodeId);
            if (!node) return;
            const person = node.person && node.person.trim() !== "-" ? node.person : "Não informado";

            orgModalCode.textContent = node.code;
            orgModalName.textContent = node.name;
            orgModalPerson.textContent = person;

            orgCopyCode.setAttribute("data-copy", node.code);
            orgCopyName.setAttribute("data-copy", node.name);
            orgCopyPerson.setAttribute("data-copy", person);

            orgModal.show();
        }

        function markCopyButton(btn, ok) {
            if (!ok) return;
            btn.classList.remove("btn-outline-secondary");
            btn.classList.add("btn-outline-success");
            setTimeout(() => {
                btn.classList.add("btn-outline-secondary");
                btn.classList.remove("btn-outline-success");
            }, 700);
        }

        function applyFilter(value) {
            const q = normalizeText(value);
            const matches = new Set();
            const visible = new Set();

            if (q) {
                allIds.forEach(id => {
                    const node = nodeById.get(id);
                    if (!node) return;
                    if (getNodeText(node).includes(q)) matches.add(id);
                });

                matches.forEach(id => {
                    let cur = id;
                    while (cur) {
                        visible.add(cur);
                        cur = parentById.get(cur);
                    }
                });
            } else {
                allIds.forEach(id => visible.add(id));
            }

            orgTree.querySelectorAll("li").forEach(li => {
                const id = li.getAttribute("data-id");
                li.classList.toggle("org-hidden", !visible.has(id));
                li.classList.toggle("org-match", matches.has(id));
                if (q && visible.has(id)) li.classList.remove("org-collapsed");
            });

            orgSummary.textContent = q ? `${visible.size} itens relevantes` : `${allIds.length} itens`;
            updateChevronIcons();
        }

        let view = { x: 0, y: 0, scale: 1 };
        let pan = { active: false, startX: 0, startY: 0, originX: 0, originY: 0 };
        const mutuallyExclusiveTop = new Set(["PF-DEAP", "PF-DEPEX"]);

        function collapseNodeById(nodeId) {
            const li = orgTree.querySelector(`li[data-id="${nodeId}"]`);
            if (!li) return;
            li.classList.add("org-collapsed");
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function applyTransform() {
            orgScene.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
        }

        function resetView() {
            view = { x: 0, y: 0, scale: 1 };
            applyTransform();
        }

        function zoomBy(delta) {
            const next = clamp(view.scale + delta, 0.55, 1.6);
            view.scale = next;
            applyTransform();
        }

        setCollapseAll(false);
        resetView();
        applyFilter("");

        orgFilter.addEventListener("input", (e) => {
            applyFilter(e.target.value);
        });

        orgClear.addEventListener("click", () => {
            orgFilter.value = "";
            applyFilter("");
            orgFilter.focus();
        });

        document.addEventListener("click", async (e) => {
            const toggleBtn = e.target.closest("[data-action='toggle']");
            if (toggleBtn) {
                e.preventDefault();
                e.stopPropagation();
                const li = toggleBtn.closest("li");
                if (!li) return;
                const nodeId = li.getAttribute("data-id");
                const willExpand = li.classList.contains("org-collapsed");
                if (willExpand && mutuallyExclusiveTop.has(nodeId)) {
                    mutuallyExclusiveTop.forEach(otherId => {
                        if (otherId !== nodeId) collapseNodeById(otherId);
                    });
                }
                li.classList.toggle("org-collapsed");
                updateChevronIcons();
                return;
            }

            const nodeBtn = e.target.closest("[data-action='open']");
            if (nodeBtn) {
                const li = nodeBtn.closest("li");
                const nodeId = li ? li.getAttribute("data-id") : null;
                if (nodeId) showModalForNode(nodeId);
                return;
            }

            const copyBtn = e.target.closest("[data-copy]");
            if (copyBtn) {
                const value = copyBtn.getAttribute("data-copy");
                try {
                    const ok = await copyText(value);
                    markCopyButton(copyBtn, ok);
                } catch {
                }
                return;
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key !== "Enter" && e.key !== " ") return;
            const node = e.target.closest("[data-action='open']");
            if (!node) return;
            e.preventDefault();
            const li = node.closest("li");
            const nodeId = li ? li.getAttribute("data-id") : null;
            if (nodeId) showModalForNode(nodeId);
        });

        orgZoomIn.addEventListener("click", () => zoomBy(0.12));
        orgZoomOut.addEventListener("click", () => zoomBy(-0.12));
        orgReset.addEventListener("click", () => resetView());
        orgExpandAll.addEventListener("click", () => setCollapseAll(false));
        orgCollapseAll.addEventListener("click", () => setCollapseAll(true));

        orgViewport.addEventListener("pointerdown", (e) => {
            if (e.button !== 0) return;
            if (e.target.closest(".org-node") || e.target.closest(".btn") || e.target.closest("input")) return;
            pan.active = true;
            pan.startX = e.clientX;
            pan.startY = e.clientY;
            pan.originX = view.x;
            pan.originY = view.y;
            orgViewport.setPointerCapture(e.pointerId);
        });

        orgViewport.addEventListener("pointermove", (e) => {
            if (!pan.active) return;
            const dx = e.clientX - pan.startX;
            const dy = e.clientY - pan.startY;
            view.x = pan.originX + dx;
            view.y = pan.originY + dy;
            applyTransform();
        });

        orgViewport.addEventListener("pointerup", () => {
            pan.active = false;
        });

        orgViewport.addEventListener("pointercancel", () => {
            pan.active = false;
        });

        orgViewport.addEventListener("wheel", (e) => {
            if (!e.ctrlKey) return;
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.08 : 0.08;
            zoomBy(delta);
        }, { passive: false });
    </script>
</body>

</html>
