<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/img/IV.ico">
    <title>Engenharia Civil - Calendário Acadêmico</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/common/header.css">
    <link rel="stylesheet" href="../../assets/css/common/footer.css">
    <link rel="stylesheet" href="../../assets/css/calendario/calendario.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <script>
        fetch('../header/index.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });
    </script>

    <main>
        <section id="time" class="py-5">
            <div class="texto-head bg-light text-center pb-3">
                <h2 class="section-title">Calendário Acadêmico</h2>
                <hr class="divider">
            </div>

            <div class="container bg">
                <div class="row g-4 justify-content-center">
                    <div class="col-lg-10">
                        <iframe
                            class="frame pdf-frame"
                            src="../../assets/docs/Calendário 2026_V1_5.pdf#toolbar=1&navpanes=0"
                            title="Calendário Acadêmico IFSul Passo Fundo 2026">
                        </iframe>
                        <div class="calendar-actions">
                            <a class="btn btn-primary" href="../../assets/docs/Calendário 2026_V1_5.pdf" target="_blank" download>
                                <i class="bi bi-download"></i> Baixar calendário
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script>
        fetch('../footer/index.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
